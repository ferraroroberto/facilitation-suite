# CI for facilitation-suite: install, unit suite, Playwright e2e (one desktop chromium leg).
#
# ADVISORY. The local gate (scripts/verify-before-ship.ps1) is the contract; this job
# is the clean-machine second opinion: a fresh .venv from requirements.txt, committed
# files only, the commit rather than somebody's working tree. It runs the unit suite
# and the e2e suite; ruff, byte-compile and the personal-data guard are the local
# gate's. The repo's `## CI expectations` block in CLAUDE.md states the duration.
#
# One run per commit (push on main + pull_request), a dated runner image and a timeout
# that caps a wedge.
#
# QUIET BY DESIGN. No third-party service, no secret beyond the implicit GITHUB_TOKEN
# (read-only below), no machine-local file read. A gitignored config that is missing on
# the runner must make a test skip or use the repo's fixture data, never fail; the seed
# step below supplies the committed samples.
name: ci

on:
  push:
    branches: [main]          # post-merge integration gate on main only
  pull_request:
    branches: [main]          # validates every feature branch via the PR event

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  gate:
    runs-on: windows-2025          # not windows-latest -- pin the OS image
    # Cap a wedge: GitHub's default is 6 h. The chromium e2e leg is the part
    # that can slow down on the hosted runner; a wedge is a flake, not the
    # diff. About 4x the typical green run.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Create .venv and install deps
        # The install is part of what this job checks: the requirements files
        # must produce a working environment on a machine with nothing on it.
        # Each native call is checked -- a step only fails on the exit code of
        # its LAST command, so an early pip failure would otherwise pass.
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Playwright browsers
        run: .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Seed gitignored config from committed samples
        # Config files are gitignored; only the `*.sample.*` templates are
        # committed, and they carry no credential. Copy each to its live name
        # when absent, so the suite runs against demo data instead of silently
        # skipping an authed fixture. Loopback traffic bypasses the bearer
        # middleware, so a sample token is enough.
        run: |
          Get-ChildItem -Path config -Filter '*.sample.*' -File -ErrorAction SilentlyContinue | ForEach-Object {
            $dest = Join-Path $_.DirectoryName ($_.Name -replace '\.sample(?=\.)', '')
            if (-not (Test-Path $dest)) { Copy-Item $_.FullName $dest }
          }

      - name: Unit suite
        run: .\.venv\Scripts\python.exe -m pytest --ignore=tests/e2e

      - name: E2E suite (desktop chromium)
        # The suite boots its own disposable app instance (conftest fixture);
        # nothing is assumed to be running. Trace + screenshot are kept only
        # for a failing test and uploaded below only when the job fails.
        run: >
          .\.venv\Scripts\python.exe -m pytest tests/e2e
          --browser chromium
          --tracing retain-on-failure
          --screenshot only-on-failure
          --output test-results

      - name: Upload e2e traces and screenshots
        # Only on failure: a green run uploads nothing.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
