# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py through
# scripts/static_ratchet_gate.py: a duplicate block (jscpd via npx, Python and JS) or an
# unused import/variable (ruff F401,F841), or a ruff bug (B) / security (S) finding (S113 strict),
# that is not in .static-ratchet-baseline.json fails.
# Needs Node and ruff in the gate's venv; a detector that cannot run exits 3, which fails
# the gate. Vendored copies are duplicates by design, so they are excluded. Procedure +
# limits: project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet docs check. The gate runs
# scripts/docs_ratchet.py through scripts/docs_ratchet_gate.py: README.md may not pass
# 40 KiB (or its baselined size), and README.md or docs/**/*.md may not gain a history
# marker (an issue reference, a dated heading, a changelog heading) beyond
# .docs-ratchet-baseline.json. Docs state the present-tense why; history lives in git,
# PRs and issues. Whole tree, never routed; exit 3 (docs unreadable) fails the gate.
# Mechanism + limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet comment check (fleet-config#1517).
# The gate runs scripts/comment_ratchet.py through scripts/comment_ratchet_gate.py: a file
# whose count of `#NNN` issue references inside comments rises beyond
# .comment-ratchet-baseline.json fails. A comment states the present-tense why; history
# lives in git, PRs and issues. Whole tree, never routed; exit 3 (a file could not be
# scanned) fails the gate as NOT CONFIRMED. Mechanism + limits: project-scaffolding
# docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"
# The quiz player's copies of the fleet CSS are byte-for-byte copies of the vendored and
# app files (tests/quiz/test_quiz_player.py holds them equal), so their upstream comments
# cannot be reworded here.
exclude  = ["app/webapp/player/static/fleet/**"]
docstrings      = true
history_phrases = true
# A build-step pointer ("step 3") narrates how the code got here. N >= 1: a quiz podium's
# "step 0" is a game state, not a pointer. `#NNN` in docstrings and `epic §` are already
# covered by `docstrings` and the shared history patterns.
extra_history_patterns = ['\bstep\s+[1-9]\d*\b']

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate runs
# scripts/structure_ratchet.py: a new file over 1,000 lines, a new function over 100 lines
# or a new directory over 40 modules fails, and so does a baselined offender that grows
# past its size in .structure-ratchet-baseline.json. The root folders must match `shape`
# plus `extra_roots`. Existing offenders are baselined at today's size, never excluded.
# Whole tree, never routed; exit 3 (git unusable, an unparseable file, an unknown shape)
# fails the gate as NOT CONFIRMED. Where code goes: docs/layout.md. Mechanism + limits:
# project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet check of the instruction files
# (CLAUDE.md, AGENTS.md, .claude/rules, every SKILL.md and the docs a skill links to) against
# the weekly prompt audit's deterministic rules. The gate runs scripts/instruction_ratchet.py:
# a rule hit that rises beyond .instruction-ratchet-baseline.json, or a file past its size cap,
# fails. Existing hits are baselined at today's count, never excluded. Whole tree, never routed
# (the reader of one file depends on another); exit 3 (git unusable, an unreadable file, an
# unreadable skill description) fails the gate as NOT CONFIRMED. Mechanism + limits:
# project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"
ci_expectations     = true
agents_pointer      = true
claude_md_max_lines = 120
repeated_text_words = 12

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet check of what the docs name.
# The gate runs scripts/doc_refs_ratchet.py: README.md, CLAUDE.md and docs/**/*.md may not
# name a repo path, `python -m` module, relative link or loopback port that does not exist,
# beyond .doc-refs-ratchet-baseline.json. Existing dangling references are baselined, never
# excluded. Whole tree, never routed (a code change can strand a reference without touching
# the doc); exit 3 (git unusable, a file not UTF-8, an unclosed fence) fails the gate as NOT
# CONFIRMED. Mechanism + limits: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
trees    = true
baseline = ".doc-refs-ratchet-baseline.json"
# Other listeners the docs name on purpose: the quiz player (:8451), the local listener (:8456), cloudflared's metrics
# endpoint (:8452), the Spotify OAuth redirect (:8765) and the Funnel alternative (:10000).
allow_refs = [":8451", ":8456", ":8452", ":8765", ":10000"]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet check for functions, classes and
# methods nothing refers to. The gate runs scripts/dead_code_ratchet.py: a definition that no
# tracked Python file reads (and no framework entry point reaches) fails unless it is in
# .dead-code-ratchet-baseline.json. Existing dead code is baselined, never excluded. Vendored
# destinations are read for references but never reported. Whole tree, never routed (deleting
# the last caller in one file strands a definition in another); exit 3 (git unusable, a file
# that does not parse) fails the gate as NOT CONFIRMED. Mechanism + limits:
# project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet check for fleet conventions held as
# ast rules. The gate runs scripts/conventions_ratchet.py: a file whose count of hits for an
# enabled rule rises above .conventions-ratchet-baseline.json fails. no-window: this app spawns
# external executables on Windows. logging-not-print: app/ and src/ are library code.
# no-drive-path: no hardcoded drive-letter data paths. secret-compare and git-wrapper stay off:
# the repo has no shared constant-time-compare or git helper to route through. Whole tree, never
# routed; exit 3 (git unusable, a file that does not parse) fails the gate as NOT CONFIRMED.
# Mechanism + limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path", "subprocess-timeout", "state-literal", "state-set-repeat", "state-write"]

