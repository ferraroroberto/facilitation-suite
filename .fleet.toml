# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-web"
icon        = "🎤"
port        = ":8449"
description = "<b>facilitation-suite</b> — local app to run a live online workshop: stage, cockpit, Zoom chat."
chips       = ["public: cloudflared quiz.robertoferraro.net → :8451 /play"]
shape       = "webapp-tray"
# Root folders the webapp-tray preset does not list; docs/layout.md says why each stays.
extra_roots = ["themes", "webapp"]

