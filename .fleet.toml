# A raw replace skips the unique temp name, the cleanup on a failed write and the
# retry while OneDrive holds the target open.
[[conventions_ratchet.must_use]]
call   = "os.replace"
helper = ["src/atomic_write.py"]
why    = "src/atomic_write.py is the one atomic file writer (unique temp, cleanup on failure, retry while held open)"

