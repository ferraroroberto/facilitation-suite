type   = "LoginState"
derive = "advance"

# A copilot capture channel's state, declared once (docs/copilot.md#a-capture-channels-state).
[[state_machines]]
name   = "copilot-channel"
module = "src/copilot/channel_state.py"
type   = "ChannelState"
derive = "advance"

# An activity capture's status, declared once (docs/live.md#a-captures-status).
[[state_machines]]
name   = "capture-status"
module = "src/live/capture_state.py"
type   = "CaptureStatus"
derive = "capture_status"

# A copilot hint's outcome, declared once (docs/results.md#a-hints-outcome).
[[state_machines]]
name   = "hint-outcome"
module = "src/results/hint_status.py"
type   = "HintStatus"
derive = "hint_status"

# A results card's load state, declared once (docs/results.md#a-cards-load-state).
[[state_machines]]
name   = "card-load"
module = "app/webapp/static/js/card-state.js"
type   = "CardState"
derive = "advance"

# The quiz player's connection label, declared once (docs/quiz-player.md).
[[state_machines]]
name   = "player-connection"
module = "app/webapp/player/static/conn-state.js"
type   = "ConnState"
derive = "connState"

# A raw replace skips the unique temp name, the cleanup on a failed write and the
# retry while OneDrive holds the target open.
[[conventions_ratchet.must_use]]
call   = "os.replace"
helper = ["src/atomic_write.py"]
why    = "src/atomic_write.py is the one atomic file writer (unique temp, cleanup on failure, retry while held open)"

# [ci.nightly] -- this repo's settings for the Mac Mini nightly (project-scaffolding docs/mac-runner.md).
# The unit leg drops `windows_only` tests (the Windows desktop reader, file-lock and OneDrive checks) and
# `needs_chromium` tests (the Mac installs WebKit only, and the session PDF and frozen capture PNGs render
# in Chromium); the local gate keeps running all of them. The WebKit e2e leg skips its own `needs_chromium`
# stories through the e2e conftest, since `exclude_marker` reaches the unit leg only. The e2e suite boots its own disposable instance,
# so there is no autoboot flag; the smoke opens its `[design.review.synthetic]` instance at `/`.
[ci.nightly]
python         = "3.14"
requirements   = ["requirements.txt"]
samples        = "config"
unit           = ["tests", "--ignore=tests/e2e"]
e2e            = ["tests/e2e"]
views          = ["/"]
exclude_marker = "not windows_only and not needs_chromium"

# Diff-proportionate e2e routing (project-scaffolding#180): first match wins; an
# unmatched path, a mixed diff, or an empty diff fails safe to the full suite.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py tests/e2e/budget/test_main_page_budget.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
junit_xml             = "data/e2e-junit.xml"  # the gate writes it; /e2e-audit reads timing from it

[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "woff", "woff2", "ttf", "otf", "webmanifest"]
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/_vendored/"
extensions = ["html"]
[[e2e.rule]]
tier       = "none"
prefix     = "app/webapp/static/_vendored/"
extensions = ["md"]
[[e2e.rule]]
tier   = "full"
prefix = "app/"
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"
[[e2e.rule]]
tier   = "full"
prefix = "assets/themes/"
[[e2e.rule]]
tier       = "full"
prefix     = "tests/fixtures/"
extensions = ["py"]
[[e2e.rule]]
tier = "full"
path = "tests/conftest.py"
[[e2e.rule]]
tier = "full"
path = "config/config.sample.json"
# Every e2e instance boots the app, which imports src/, so any src/ change runs the browser
# suite (#171; the owner chose this over the gate-time trade of skipping it).
[[e2e.rule]]
tier   = "full"
prefix = "src/"
[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py", "json", "yaml", "txt", "jsonl"]
[[e2e.rule]]
tier   = "none"
prefix = "scripts/"
[[e2e.rule]]
tier   = "none"
prefix = "config/"
[[e2e.rule]]
tier   = "none"
prefix = "docs/"
[[e2e.rule]]
tier   = "none"
prefix = "brand/"
[[e2e.rule]]
tier   = "none"
prefix = "assets/"
[[e2e.rule]]
tier       = "none"
extensions = ["md", "bat", "toml", "ini", "txt", "yaml", "yml", "example"]
[[e2e.rule]]
tier = "none"
path = ".gitignore"
[[e2e.rule]]
tier = "none"
path = ".gitattributes"
[[e2e.rule]]
tier = "none"
path = ".ratchets/static.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/docs.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/comment.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/structure.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/instruction.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/doc-refs.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/dead-code.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/conventions.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/runtime-write.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/usage-track.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/ux-surface.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/request-budget.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/windows-only.json"
[[e2e.rule]]
tier = "none"
path = "LICENSE"

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .ratchets/runtime-write.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".ratchets/runtime-write.json"
# `data_dir` is the declared data root; `outside_code` (src/write_target.py) refuses a target under a code folder at run time.
safe_calls = ["data_dir", "outside_code"]

# [usage_track_ratchet] -- scripts/usage_track_ratchet.py (with its reader
# scripts/usage_track_scan.py) fails when the web app's HTML or JS gains a control with no
# constant `data-track` id, a <dialog> with no `data-track-view`, or a tracking id built at
# run time, beyond .ratchets/usage-track.json; `usage-log-wired` also fails, never
# baselined, when the app does not vendor, start and mount its usage log. Exit 3 is "not
# confirmed", never clean. Mechanism: project-scaffolding docs/usage-track-ratchet.md.
[usage_track_ratchet]
enabled  = true
baseline = ".ratchets/usage-track.json"
rules    = ["untracked-control", "untracked-sheet", "dynamic-id", "usage-log-wired", "health-routes-wired"]
# Shared control builders (the font editor's `tabs`, the Plan tab's choice, select and reset helpers, the Settings rows and sheets); every caller passes the id.
builders = [
  "app/webapp/static/js/font-editor.js:tabs",
  "app/webapp/static/js/views/plan-fields.js:segmentedChoice",
  "app/webapp/static/js/views/plan-fields.js:selectField",
  "app/webapp/static/js/views/plan-fields.js:resetButton",
  "app/webapp/static/js/views/settings-rows.js:valueRow",
  "app/webapp/static/js/views/settings-rows.js:selectRow",
  "app/webapp/static/js/views/settings-rows.js:toggleRow",
  "app/webapp/static/js/views/settings-rows.js:numberRow",
  "app/webapp/static/js/views/settings-rows.js:actionRow",
  "app/webapp/static/js/dialogs.js:sheetDialog",
]

# [ux_surface_ratchet] -- scripts/ux_surface_ratchet.py fails when the web app's HTML or JS gains a
# surface root (a <dialog>, a dialog/menu/tabpanel role, a popover) with no constant
# `data-surface` id, an id with no entry in docs/ux-surfaces.yaml, a map entry no element
# carries, one id on two surfaces, a link to an id with no entry, or a docs/ux-surface-map.md page
# not regenerated from the map, beyond .ratchets/ux-surface.json. Exit 3 is
# "not confirmed", never clean. Mechanism: project-scaffolding docs/ux-surface-ratchet.md.
# The quiz player is a separate public page of this app, so it is scanned too.
[ux_surface_ratchet]
enabled  = true
baseline = ".ratchets/ux-surface.json"
map      = "docs/ux-surfaces.yaml"
paths    = ["app/webapp/static/**", "app/webapp/player/**"]

# [request_budget_ratchet] -- scripts/request_budget_ratchet.py (with its reader
# scripts/request_budget_scan.py) fails when a file's count of fixed-rate browser polls that reach
# the server, polls under the 2 s floor, undeclared fast server loops, directory scans in a request
# handler, shared default-pool submits or a missing request-timing middleware rises beyond
# .ratchets/request-budget.json. Exit 3 is "not confirmed", never clean. Mechanism:
# project-scaffolding docs/request-budget-ratchet.md; the rules and why: docs/polling-budget.md.
# The quiz player is a separate public page of this app, so its browser code is scanned too.
[request_budget_ratchet]
enabled       = true
baseline      = ".ratchets/request-budget.json"
browser_paths = ["app/webapp/static/**", "app/webapp/templates/**", "app/webapp/player/**"]
handler_dirs  = ["app/webapp/routers"]

# [windows_only_ratchet] -- scripts/windows_only_ratchet.py fails when a file's count of tests that
# touch a Windows-only API (an import of winreg/win32*, subprocess.CREATE_NO_WINDOW, ctypes.windll,
# a Windows-only env var read, a planted .exe under a fake install folder) without the `windows_only`
# marker rises beyond .ratchets/windows-only.json. The Mac nightly drops that marker
# ([ci.nightly] exclude_marker), so an unmarked test is a red a day later. Exit 3 is "not confirmed",
# never clean. Mechanism: project-scaffolding docs/windows-only-ratchet.md.
[windows_only_ratchet]
enabled    = true
baseline   = ".ratchets/windows-only.json"
marker     = "windows_only"
test_paths = ["tests/**"]

# What the main page may read in a visible minute, held by the browser probe in
# tests/e2e/budget/test_main_page_budget.py (the probe: tests/e2e/budget/_request_budget.py). The measured minute is 4: the
# sessions list is read three times as the page boots and the usage log flushes once. The only
# poll, the build check, ticks every five minutes, so a longer visit adds almost nothing.
[request_budget]
visible_requests_per_minute = 2

# The server loops that run faster than the request budget's 5 s floor on purpose. Each states
# why it cannot wait longer; a loop that could is fixed instead of declared here.
[[request_budget.loops]]
path       = "src/chat/reader.py"
function   = "Reader.run"
interval_s = 0.5
why        = "the live chat reader: a message typed in the meeting chat must reach the stage within a second"

[[request_budget.loops]]
path       = "src/chat/reader.py"
function   = "Reader._beat_loop"
interval_s = 1
why        = "the reader's alive signal; the server calls the reader stale after 3 s without one"

[[request_budget.loops]]
path       = "src/chat/hub.py"
function   = "ChatHub.monitor"
interval_s = 1
why        = "turns a silent reader into 'stale' on the presenter within a second of its 3 s heartbeat limit; it only compares timestamps"

[[request_budget.loops]]
path       = "src/obs/service.py"
function   = "ObsService._run"
interval_s = 1
why        = "while the OBS feature is on and OBS is not answering, reconnects with a 1-10 s backoff so a scene switch works as soon as OBS opens; while off it waits for the switch"

[[request_budget.loops]]
path       = "src/tunnel.py"
function   = "Tunnel.supervise"
interval_s = 30
why        = "respawns the quiz tunnel process when it dies, backing off from 30 s to 5 min; a live check starts nothing"

[[request_budget.loops]]
path       = "app/tray/overlay/__main__.py"
function   = "listen"
interval_s = 2
why        = "the copilot overlay reconnects to the app's own socket after a restart; while connected it blocks on the socket"

[[request_budget.loops]]
path       = "app/webapp/manager.py"
function   = "WebappManager._wait_until_ready"
interval_s = 0.4
why        = "a bounded start-up wait: polls the freshly started webapp until it answers or the deadline passes, then ends"

[[request_budget.loops]]
path       = "app/webapp/player/listener.py"
function   = "EmbeddedListener.start"
interval_s = 0.02
why        = "a bounded start-up wait for the embedded server's bind, ended by START_TIMEOUT_S"

[[request_budget.loops]]
path       = "src/activities/replay_render.py"
function   = "_boot"
interval_s = 0.25
why        = "a bounded boot wait for the disposable render instance, ended by BOOT_TIMEOUT_S"

# The scaffold's verify skill (project-scaffolding#412) boots the suite's own disposable instance and
# must never set the live opt-in (the suite exits if it is set). /healthz is the default ready path and fits; the data-dir default
# (FACILITATION_SUITE_DATA_DIR) does not, the app reads FS_DATA_DIR.
[verify]
boot           = "tests/e2e/conftest.py::boot_instance"
live_optin_env = "FS_E2E_LIVE"
data_dir_env   = "FS_DATA_DIR"

# /perf-review: "ready" = the first session row painted from /api/sessions, visible on the landing
# view (the Sessions tab), not a painted shell (#166). An empty ledger would never show it.
[perf.review]
ready_selector = ".session-row"

# /design-review and /design-sync (#183). Width follows the shape of a view: Plan (master-detail
# with a live stage preview) spans the window above 1100px, and so do Groups and Results, the
# other master-detail views (#189); the presenter's Live cockpit is full-bleed by design and is
# not a tab of the walked page. Only the Sessions list keeps the 772px measure (app.css).
[design]
wide_views = ["plan", "groups", "results", "live"]

# Verdicts on two /design-sync WARNs (#224, #233). Neither finding names an evidence file, so each is
# a two-line repo-level entry that matches the check whatever its detail says.
[[design.accepted]]
check  = "glyph-icons"
reason = "the arrow characters are keyboard-key legends, aria-label text, menu-path prose and code comments, not icons drawn in place of a Lucide glyph"

[[design.accepted]]
check  = "icon-sizes"
reason = "every size outside 16/18/20/24 is on the projector stage or in the presenter's miniature slide thumbnail (12px beside 11px text); the stage follows the session theme, not the fleet design"

[design.review]
# /design-review's e2e capture (tests/e2e/_surface.py) flips light/dark in place on an open surface; every
# page stamps html[data-theme] at load from facilitation-suite.theme, so the hook sets that key too or its
# dark shots stay light. (The stage follows the session theme and is never tagged.)
theme_storage_key = "facilitation-suite.theme"
# The stage preview in the Plan editor and the stage-font sample in Settings are the real stage
# drawn by the session theme (assets/themes/*.css), not the fleet design: not the app's own UI, so
# nothing in them is measured.
exclude_selectors = [".preview-frame", ".font-sample-host"]

# Settings is a pane behind the header gear, not a tab: open it once so the walk sees the
# vendored text-size control (A11Y-02) and measures the Settings pane at all.
[[design.review.extra_steps]]
tab   = "sessions"
id    = "settings"
click = "[data-open-settings]"

# `measure --e2e` and `--synthetic` walk this throwaway instance (the suite's own boot_instance: temp
# config, ledger and data, free ports), never the live tray on :8449 (scripts/design_review_synthetic.py).
# The suite boots its own server, so [design.review.e2e] needs no autoboot flag.
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 60
