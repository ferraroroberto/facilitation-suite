# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".runtime-write-ratchet-baseline.json"
# `data_dir` is the declared data root; `outside_code` (src/write_target.py) refuses a target under a code folder at run time.
safe_calls = ["data_dir", "outside_code"]

# [usage_track_ratchet] -- scripts/usage_track_ratchet.py (with its reader
# scripts/usage_track_scan.py) fails when the web app's HTML or JS gains a control with no
# constant `data-track` id, a <dialog> with no `data-track-view`, or a tracking id built at
# run time, beyond .usage-track-ratchet-baseline.json; `usage-log-wired` also fails, never
# baselined, when the app does not vendor, start and mount its usage log. Exit 3 is "not
# confirmed", never clean. Mechanism: project-scaffolding docs/usage-track-ratchet.md.
[usage_track_ratchet]
enabled  = true
baseline = ".usage-track-ratchet-baseline.json"
rules    = ["untracked-control", "untracked-sheet", "dynamic-id", "usage-log-wired"]
# Shared control builders (the font editor's `tabs`, the Plan tab's choice, select and reset helpers); every caller passes the id.
builders = [
  "app/webapp/static/js/font-editor.js:tabs",
  "app/webapp/static/js/views/plan-fields.js:segmentedChoice",
  "app/webapp/static/js/views/plan-fields.js:selectField",
  "app/webapp/static/js/views/plan-fields.js:resetButton",
]

# The scaffold's verify skill (project-scaffolding#412) boots the suite's own disposable instance and
# must never set the live opt-in (the suite exits if it is set). /healthz is the default ready path and fits; the data-dir default
# (FACILITATION_SUITE_DATA_DIR) does not, the app reads FS_DATA_DIR.
[verify]
boot           = "tests/e2e/conftest.py::boot_instance"
live_optin_env = "FS_E2E_LIVE"
data_dir_env   = "FS_DATA_DIR"

# /perf-review: "ready" = the first session row painted from /api/sessions, visible on the landing
# view (the Sessions tab), not a painted shell (#166). An empty ledger would never show it.
[perf.review]
ready_selector = ".session-row"

# /design-review and /design-sync (#183). Width follows the shape of a view: Plan (master-detail
# with a live stage preview) spans the window above 1100px, and so do Groups and Results, the
# other master-detail views (#189); the presenter's Live cockpit is full-bleed by design and is
# not a tab of the walked page. Only the Sessions list keeps the 772px measure (app.css).
[design]
wide_views = ["plan", "groups", "results", "live"]

# Verdicts on two /design-sync WARNs (#224, #233). Neither finding names an evidence file, so each is
# a two-line repo-level entry that matches the check whatever its detail says.
[[design.accepted]]
check  = "glyph-icons"
reason = "the arrow characters are keyboard-key legends, aria-label text, menu-path prose and code comments, not icons drawn in place of a Lucide glyph"

[[design.accepted]]
check  = "icon-sizes"
reason = "every size outside 16/18/20/24 is on the projector stage or in the presenter's miniature slide thumbnail (12px beside 11px text); the stage follows the session theme, not the fleet design"

[design.review]
# /design-review's e2e capture (tests/e2e/_surface.py) flips light/dark in place on an open surface; every
# page stamps html[data-theme] at load from facilitation-suite.theme, so the hook sets that key too or its
# dark shots stay light. (The stage follows the session theme and is never tagged.)
theme_storage_key = "facilitation-suite.theme"
# The stage preview in the Plan editor and the stage-font sample in Settings are the real stage
# drawn by the session theme (assets/themes/*.css), not the fleet design: not the app's own UI, so
# nothing in them is measured.
exclude_selectors = [".preview-frame", ".font-sample-host"]

# Settings is a pane behind the header gear, not a tab: open it once so the walk sees the
# vendored text-size control (A11Y-02) and measures the Settings pane at all.
[[design.review.extra_steps]]
tab   = "sessions"
id    = "settings"
click = "[data-open-settings]"

# `measure --e2e` and `--synthetic` walk this throwaway instance (the suite's own boot_instance: temp
# config, ledger and data, free ports), never the live tray on :8449 (scripts/design_review_synthetic.py).
# The suite boots its own server, so [design.review.e2e] needs no autoboot flag.
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 60
