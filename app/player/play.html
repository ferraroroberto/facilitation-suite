<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<title>Quiz</title>
<script>
  // Pre-paint theme stamp (fleet design): the phone's own choice, else the OS setting.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('facilitation-suite.play.theme'); } catch (e) {}
    var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<!-- The player app shares nothing with :8449: these are its own copies of the fleet
     tokens and vendored stylesheets (app/player/static/fleet/, kept byte-identical by a test). -->
<link rel="stylesheet" href="/play/static/fleet/tokens.css">
<link rel="stylesheet" href="/play/static/fleet/base.css">
<link rel="stylesheet" href="/play/static/fleet/card.css">
<link rel="stylesheet" href="/play/static/fleet/button.css">
<link rel="stylesheet" href="/play/static/play.css">
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <!-- Lucide (ISC), from the app's sprite -->
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-triangle-alert" viewBox="0 0 24 24" fill="none"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-cloud-off" viewBox="0 0 24 24" fill="none"><path d="M10.94 5.274A7 7 0 0 1 15.71 10h1.79a4.5 4.5 0 0 1 4.222 6.057"/><path d="M18.796 18.81A4.5 4.5 0 0 1 17.5 19H9A7 7 0 0 1 5.79 5.78"/><path d="m2 2 20 20"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24" fill="none"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></symbol>
  <!-- The four answer shapes (shape and colour, never colour alone): 1 triangle, 2 diamond, 3 circle, 4 square -->
  <symbol id="s-1" viewBox="0 0 24 24"><path d="M12 3 22.5 21h-21z"/></symbol>
  <symbol id="s-2" viewBox="0 0 24 24"><path d="M12 1.5 22.5 12 12 22.5 1.5 12z"/></symbol>
  <symbol id="s-3" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></symbol>
  <symbol id="s-4" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1.5"/></symbol>
</svg>

<main class="play" data-screen="loading">
  <header class="play-head">
    <h1 class="play-title">Quiz</h1>
    <span class="play-conn" id="conn" data-state="checking" role="status" aria-live="polite">Connecting…</span>
    <button type="button" class="button-surface play-icon-btn hit-target" data-theme-toggle aria-label="Switch light or dark">
      <svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg>
      <svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
    </button>
  </header>

  <section class="card screen" data-for="loading">
    <p class="play-lead">Loading…</p>
  </section>

  <section class="card screen" data-for="join">
    <form id="joinForm" class="play-form" novalidate>
      <label class="play-label" for="pin">Game PIN</label>
      <input class="play-input play-pin" id="pin" name="pin" inputmode="numeric" autocomplete="off" maxlength="7"
             pattern="[0-9 ]*" placeholder="123 456" required>
      <label class="play-label" for="nickname">Nickname</label>
      <input class="play-input" id="nickname" name="nickname" autocomplete="nickname" maxlength="20" placeholder="Your name" required>
      <p class="play-error" id="joinError" role="alert" hidden></p>
      <button type="submit" class="button-primary play-wide" id="joinBtn">Join</button>
    </form>
  </section>

  <section class="card screen" data-for="wait">
    <p class="play-name" data-name></p>
    <p class="play-lead" data-wait-text>You're in! Watch the screen — the quiz starts soon.</p>
  </section>

  <section class="screen play-question" data-for="question">
    <div class="play-qhead">
      <span data-qindex></span>
      <span class="play-timer" data-timer><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg> <span data-left></span></span>
    </div>
    <h2 class="play-qtext" data-qtext></h2>
    <div class="play-tiles" data-tiles></div>
  </section>

  <section class="card screen play-locked" data-for="locked">
    <span class="play-badge" data-locked-shape></span>
    <p class="play-status" data-answer-status></p>
    <p class="play-lead" data-locked-text></p>
  </section>

  <section class="card screen play-result" data-for="result">
    <p class="play-result-title" data-result></p>
    <div class="play-right" data-right hidden></div>
    <p class="play-lead" data-result-detail></p>
  </section>

  <section class="card screen" data-for="kicked">
    <p class="play-result-title"><svg class="icon" aria-hidden="true"><use href="#i-triangle-alert"/></svg> Removed</p>
    <p class="play-lead">The host removed you from this game.</p>
  </section>
</main>
<script type="module" src="/play/static/play.js"></script>
</body>
</html>
