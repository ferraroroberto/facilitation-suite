<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Quiz</title>
<style>
  /* Self-contained on purpose: the player app shares nothing with :8449, not even
     its static files. Colours are the fleet tokens (tokens.css), light + dark. */
  :root { --bg: #ffffff; --card-off: #f6f8fa; --ink: #1f2328; --muted: #656d76; --line: #d1d9e0;
          --success: #1a7f37; --danger: #cf222e; --radius: 16px; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --card-off: #010409; --ink: #e6edf3; --muted: #7d8590; --line: #30363d;
            --success: #3fb950; --danger: #f85149; }
  }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  main { width: min(100% - 32px, 420px); padding: 24px; border: 1px solid var(--line); border-radius: var(--radius);
         background: var(--card-off); }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0 0 16px; color: var(--muted); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .ok { color: var(--success); }
  .bad { color: var(--danger); }
</style>
</head>
<body>
<main>
  <h1>Quiz</h1>
  <p>The quiz will appear here. This page checks the connection.</p>
  <dl>
    <dt>HTTP</dt><dd id="http">checking…</dd>
    <dt>Live link</dt><dd id="ws">checking…</dd>
  </dl>
</main>
<script type="module">
  const show = (id, text, ok) => {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = ok ? "ok" : "bad";
  };

  const t0 = performance.now();
  fetch("/play/api/ping", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
    .then(() => show("http", `ok · ${Math.round(performance.now() - t0)} ms`, true))
    .catch((e) => show("http", `failed · ${e.message}`, false));

  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${scheme}//${location.host}/play/ws`);
  let sent = 0;
  ws.onopen = () => { sent = performance.now(); ws.send("ping"); };
  ws.onmessage = (ev) => {
    if (ev.data === "ping") show("ws", `ok · ${Math.round(performance.now() - sent)} ms round trip`, true);
    ws.close();
  };
  ws.onerror = () => show("ws", "failed · WebSocket blocked or down", false);
</script>
</body>
</html>
