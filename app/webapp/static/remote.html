<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<title>facilitation-suite · remote</title>
<script>
  (function () {
    var app = 'facilitation-suite';
    var root = document.documentElement;
    var theme = null;
    try { theme = localStorage.getItem(app + '.theme'); } catch (e) {}
    var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'dark' : 'light';
    root.dataset.textsize = 'default';
  })();
</script>
<link rel="icon" href="/static/icons/favicon.ico">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="stylesheet" href="/static/css/fonts.css">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/_vendored/base/base.css">
<link rel="stylesheet" href="/static/_vendored/nav/nav-tabs.css">
<link rel="stylesheet" href="/static/_vendored/card/card.css">
<link rel="stylesheet" href="/static/_vendored/button/button.css">
<link rel="stylesheet" href="/static/_vendored/range-tab/range-tab.css">
<link rel="stylesheet" href="/static/_vendored/empty-state/empty-state.css">
<link rel="stylesheet" href="/static/_vendored/home-head/home-head.css">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/themes/default.css">
<link rel="stylesheet" href="/static/css/stage.css">
<link rel="stylesheet" href="/static/css/remote.css">
</head>
<body class="remote-page">
<!--SPRITE-->
<nav class="tabs" role="tablist" aria-label="Remote" data-active-tab="live">
  <button id="tabLive" type="button" class="tab active" data-tab="live" role="tab" aria-selected="true" aria-controls="paneLive">
    <svg class="tab-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
      <path d="M2 3h20" /><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3" /><path d="m7 21 5-5 5 5" />
    </svg>
    <span class="tab-label">Live</span>
  </button>
  <button id="tabChat" type="button" class="tab" data-tab="chat" role="tab" aria-selected="false" aria-controls="paneChat" tabindex="-1">
    <svg class="tab-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
      <path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z" />
    </svg>
    <span class="tab-label">Chat</span>
  </button>
  <button id="tabGroups" type="button" class="tab" data-tab="groups" role="tab" aria-selected="false" aria-controls="paneGroups" tabindex="-1">
    <svg class="tab-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
      <path d="m18 14 4 4-4 4" /><path d="m18 2 4 4-4 4" /><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22" /><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2" /><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" />
    </svg>
    <span class="tab-label">Groups</span>
  </button>
</nav>
<main class="app remote">
  <section id="paneLive" class="pane" role="tabpanel" aria-labelledby="tabLive"></section>
  <section id="paneChat" class="pane" role="tabpanel" aria-labelledby="tabChat" hidden></section>
  <section id="paneGroups" class="pane" role="tabpanel" aria-labelledby="tabGroups" hidden></section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/static/js/remote.js"></script>
</body>
</html>
