<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<title>Feedback</title>
<script>
  // Pre-paint theme stamp (fleet design): the phone's own choice, else the OS setting.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('facilitation-suite.play.theme'); } catch (e) {}
    var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<!-- The quiz player's own copies of the fleet tokens and vendored stylesheets, as play.html. -->
<link rel="stylesheet" href="/play/static/fleet/tokens.css">
<link rel="stylesheet" href="/play/static/fleet/base.css">
<link rel="stylesheet" href="/play/static/fleet/card.css">
<link rel="stylesheet" href="/play/static/fleet/button.css">
<link rel="stylesheet" href="/play/static/play.css">
<link rel="stylesheet" href="/play/static/form.css">
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <!-- Lucide (ISC), from the app's sprite -->
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
</svg>

<main class="play" data-screen="loading">
  <header class="play-head">
    <h1 class="play-title" data-form-heading data-t="title">Feedback</h1>
    <button type="button" class="button-surface play-icon-btn hit-target" data-theme-toggle aria-label="Switch light or dark" data-t-label="theme">
      <svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg>
      <svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
    </button>
  </header>

  <section class="card screen" data-for="loading" data-surface="player.form-loading">
    <p class="play-lead" data-t="loading">Loading…</p>
  </section>

  <section class="screen fm-form" data-for="form" data-surface="player.form">
    <p class="fm-intro" data-form-intro></p>
    <form id="feedbackForm" class="fm-questions" novalidate>
      <div class="fm-list" data-questions></div>
      <div class="card fm-q">
        <label class="play-label" for="fmName" data-t="name_label">Your name (optional)</label>
        <input class="play-input" id="fmName" name="name" autocomplete="name" maxlength="40" placeholder="Leave empty to stay anonymous" data-t-placeholder="name_placeholder">
      </div>
      <p class="play-error" id="formError" role="alert" hidden></p>
      <button type="submit" class="button-primary play-wide" id="formSend" data-t="send">Send</button>
      <p class="play-lead fm-private" data-t="private">Your answers go only to the host. They are never shown on the screen.</p>
    </form>
  </section>

  <section class="card screen play-result" data-for="thanks" data-surface="player.form-thanks">
    <p class="play-result-title" data-kind="ok"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg> <span data-t="thanks">Thank you!</span></p>
    <p class="play-lead" data-t="thanks_detail">Your answers were sent.</p>
    <button type="button" class="button-surface play-wide" data-again data-t="again">Send another response</button>
  </section>

  <section class="card screen play-result" data-for="closed" data-surface="player.form-closed">
    <p class="play-result-title"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg> <span data-t="closed">This form is closed</span></p>
    <p class="play-lead" data-t="closed_detail">The host is not taking responses right now. Thank you for your time.</p>
  </section>
</main>
<script type="module" src="/play/static/form.js"></script>
</body>
</html>
